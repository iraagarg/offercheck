[project]
name = "offercheck-ml"
version = "0.1.0"
description = "OfferCheck ML service: text extraction and the text classifier"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.uv]
package = false
# Supply-chain safety: only resolve package versions published at least 14 days before this date.
exclude-newer = "2026-10-10T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
